server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: influencer-core-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BrandCollabzPrimaryPool
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 20000
      max-lifetime: 300000
      connection-timeout: 15000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

collector:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BrandCollabzCollectorPool
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 20000
      max-lifetime: 300000
      connection-timeout: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  payment:
    currency: INR
  backend-base-url: ${BACKEND_BASE_URL:https://adrovis-influencer-backend.onrender.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

analytics:
  visitor-salt: ${ANALYTICS_VISITOR_SALT:bc_secret_salt_2026_brand_collabz}
  admin-key: ${ANALYTICS_ADMIN_KEY:brand_collabz_admin_secret_99}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    root: INFO
    com.adrovis.influencer: INFO


razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

