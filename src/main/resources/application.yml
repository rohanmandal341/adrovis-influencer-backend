server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: influencer-core-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BrandCollabzHikariPool
      maximum-pool-size: 4       # LEAVE AT 3-4 (Never use 15 on Supabase starter/free pooler)
      minimum-idle: 1
      idle-timeout: 20000
      max-lifetime: 300000       # 5 minutes (prevents pooler timeout desync)
      connection-timeout: 15000
      leak-detection-threshold: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  backend-base-url: ${BACKEND_BASE_URL:https://adrovis-influencer-backend.onrender.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

analytics:
  visitor-salt: ${ANALYTICS_VISITOR_SALT:bc_secret_salt_2026_brand_collabz}
  admin-key: ${ANALYTICS_ADMIN_KEY:brand_collabz_admin_secret_99}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}